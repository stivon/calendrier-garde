<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier de garde — Philippine & Pablo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:#185fa5;color:#fff;padding:0.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
header h1{font-size:18px;font-weight:500}
header p{font-size:13px;opacity:0.75;margin-top:2px}
.container{flex:1;display:flex;flex-direction:column;padding:0.75rem;max-width:none;margin:0;overflow:hidden}
.cal-card{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:12px;border:1px solid #e5e5e3;overflow:hidden;margin-bottom:0}
#cal{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1.5rem;border-bottom:1px solid #e5e5e3;flex-shrink:0}
.cal-nav h2{font-size:18px;font-weight:500;color:#1a1a1a}
.cal-nav button{background:none;border:1px solid #d0d0cc;border-radius:8px;padding:6px 16px;cursor:pointer;font-size:14px;color:#1a1a1a;font-family:inherit}
.cal-nav button:hover{background:#f5f5f3}
.cal-nav button:disabled{opacity:0.3;cursor:default}
.legend{display:flex;gap:14px;padding:0.5rem 1.5rem;font-size:12px;color:#666;border-bottom:1px solid #e5e5e3;flex-wrap:wrap;align-items:center;background:#fafaf9;flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-swatch{display:inline-block;width:18px;height:18px;border-radius:3px;border:1px solid #d0d0cc;flex-shrink:0}
.swatch-evening{background:linear-gradient(to bottom,#f5f5f3 65%,#0c447c 35%)}
.swatch-day{background:#e6f1fb}
.swatch-full{background:linear-gradient(to bottom,#e6f1fb 65%,#0c447c 35%)}
.counter{margin-left:auto;font-size:12px;color:#999;font-weight:500}
.cal-week-headers{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid #e5e5e3;border-top:1px solid #e5e5e3;flex-shrink:0}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-left:1px solid #e5e5e3;overflow:hidden}
.day-header{text-align:center;font-size:12px;font-weight:600;color:#888;padding:10px 2px;border-right:1px solid #e5e5e3;border-bottom:1px solid #e5e5e3;text-transform:uppercase;letter-spacing:0.04em;background:#fafaf9}
.day-cell{border-right:1px solid #e5e5e3;border-bottom:1px solid #e5e5e3;padding:10px;cursor:pointer;position:relative;transition:background 0.1s;user-select:none;overflow:hidden}
.day-cell.empty{background:#fafaf9;cursor:default;pointer-events:none}
.day-cell.type-day,.day-cell.type-full{background:#e6f1fb}
.day-cell.type-evening::after,.day-cell.type-full::after{content:'';position:absolute;left:0;right:0;bottom:0;height:20%;background:#0c447c;pointer-events:none}
.day-cell.updating{opacity:0.5;pointer-events:none}
.day-num{font-size:15px;font-weight:600;color:#1a1a1a;line-height:1.3}
.day-cell.empty .day-num{color:#ccc}
.day-cell.today .day-num{background:#185fa5;color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px}
.custody-label{font-size:12px;color:#185fa5;font-weight:600;margin-top:4px}
.note-preview{font-size:11px;color:#555;margin-top:5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.note-btn{position:absolute;top:5px;right:5px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:50%;cursor:pointer;opacity:0.7;line-height:1}
.note-btn:hover{opacity:1;background:rgba(0,0,0,0.06)}
.note-btn.has-note{opacity:1;background:rgba(226,75,74,0.12)}
.note-btn.has-note:hover{background:rgba(226,75,74,0.22)}
.edit-btn{position:absolute;top:5px;right:28px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:50%;cursor:pointer;opacity:0.7;line-height:1}
.edit-btn:hover{opacity:1;background:rgba(0,0,0,0.06)}
.photo-btn{position:absolute;top:5px;right:52px;display:flex;align-items:center;gap:2px;padding:2px 6px;font-size:11px;border-radius:10px;cursor:pointer;opacity:0.85;background:rgba(24,95,165,0.08);line-height:1.4}
.photo-btn:hover{opacity:1;background:rgba(24,95,165,0.16)}
.import-btn{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.import-btn:hover{background:rgba(255,255,255,0.25)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0.9rem;max-height:60vh;overflow-y:auto}
.photo-item{position:relative}
.photo-item img{width:100%;height:110px;object-fit:cover;border-radius:6px;border:1px solid #e5e5e3;display:block;cursor:pointer}
.photo-del{position:absolute;top:4px;right:4px;background:rgba(255,255,255,0.9);border:none;border-radius:50%;width:22px;height:22px;cursor:pointer}
.photo-date-icon{position:absolute;bottom:4px;right:4px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,0.9);border-radius:50%;pointer-events:none}
.photo-move{position:absolute;bottom:4px;right:4px;width:22px;height:22px;padding:0;border:none;border-radius:50%;opacity:0;cursor:pointer}
.lightbox-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:200}
.lightbox-img{max-width:90vw;max-height:90vh;object-fit:contain;border-radius:4px}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer}
.lightbox-close:hover{background:rgba(255,255,255,0.3)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer}
.lightbox-nav:hover{background:rgba(255,255,255,0.3)}
.lightbox-prev{left:16px}
.lightbox-next{right:16px}
/* Spinner */
.spinner-wrap{display:flex;align-items:center;justify-content:center;padding:4rem 1rem;flex-direction:column;gap:12px;color:#888;font-size:13px}
.spinner{width:28px;height:28px;border:3px solid #e5e5e3;border-top-color:#185fa5;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load-error{padding:2.5rem 1.5rem;text-align:center;color:#a32d2d;font-size:13px}
/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#fff;border-radius:12px;border:1px solid #e5e5e3;padding:1.75rem;width:460px;max-width:94vw;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.modal h3{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:4px}
.type-buttons{display:flex;gap:6px;margin-bottom:0.9rem}
.type-buttons button{flex:1;padding:7px 4px;border-radius:8px;font-size:11px;cursor:pointer;border:1px solid #d0d0cc;background:#fff;color:#1a1a1a;font-family:inherit;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.type-buttons button:hover{background:#f5f5f3}
.type-buttons button.active{background:#185fa5;color:#fff;border-color:#185fa5}
.modal textarea{width:100%;min-height:100px;resize:vertical;font-size:13px;font-family:inherit;color:#1a1a1a;background:#fafaf9;border:1px solid #d0d0cc;border-radius:8px;padding:9px;line-height:1.5}
.modal textarea:focus{outline:none;border-color:#185fa5}
.modal-actions{display:flex;gap:8px;margin-top:0.8rem;justify-content:flex-end}
.modal-actions button{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid #d0d0cc;background:none;color:#1a1a1a;font-family:inherit}
.modal-actions button:hover{background:#f5f5f3}
.modal-actions .save-btn{background:#185fa5;color:#fff;border-color:#185fa5}
.modal-actions .save-btn:hover{background:#0c447c}
.modal-actions .del-btn{color:#a32d2d;border-color:#e8bfbf}
.modal-actions .del-btn:hover{background:#fdf0f0}
</style>
</head>
<body>
<header>
  <div>
    <h1>Calendrier de garde</h1>
    <p>Philippine &amp; Pablo · Novembre 2024 – Juin 2026</p>
  </div>
  <button class="import-btn" id="import-btn">📷 Importer des photos</button>
  <input type="file" id="photo-input" multiple accept="image/*" style="display:none">
</header>
<div class="container">
  <div class="cal-card" id="cal">
    <div class="spinner-wrap"><div class="spinner"></div><span>Chargement…</span></div>
  </div>
</div>

<script>
const MFR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DFR=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const _now=new Date();
let cy=_now.getFullYear(),cm=_now.getMonth(),notes={},custodyMap=new Map(),photosMap=new Map(),modal=null,ready=false;

function dk(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}

async function loadData(){
  try{
    const [daysRes,notesRes,photosRes]=await Promise.all([fetch('/api/days'),fetch('/api/notes'),fetch('/api/photos')]);
    if(!daysRes.ok||!notesRes.ok||!photosRes.ok)throw new Error('Réponse API invalide');
    const days=await daysRes.json();
    const notesArr=await notesRes.json();
    const photosArr=await photosRes.json();
    custodyMap=new Map(days.map(d=>[d.date,{source:d.source,type:d.type}]));
    notes={};
    notesArr.forEach(n=>{notes[n.date]=n.text;});
    photosMap=new Map();
    photosArr.forEach(p=>{
      if(!photosMap.has(p.date))photosMap.set(p.date,[]);
      photosMap.get(p.date).push(p);
    });
    ready=true;
    render();
  }catch(e){
    document.getElementById('cal').innerHTML='<div class="load-error">Impossible de charger les données. Vérifiez votre connexion et rechargez la page.</div>';
  }
}

function openCustodyModal(key,label){
  const entry=custodyMap.get(key);
  let pendingType=entry?entry.type:null;
  const bd=document.createElement('div');
  bd.className='modal-backdrop';
  bd.innerHTML=`<div class="modal">
    <h3>${label}</h3>
    <div class="type-buttons" style="margin-top:0.9rem">
      <button class="type-btn${pendingType==='evening'?' active':''}" data-type="evening"><span class="legend-swatch swatch-evening"></span>Soir</button>
      <button class="type-btn${pendingType==='day'?' active':''}" data-type="day"><span class="legend-swatch swatch-day"></span>Journée</button>
      <button class="type-btn${pendingType==='full'?' active':''}" data-type="full"><span class="legend-swatch swatch-full"></span>Journée + nuit</button>
    </div>
    <div class="modal-actions">
      <button id="cb">Annuler</button>
      <button class="save-btn" id="sb">Enregistrer</button>
    </div>
  </div>`;
  bd.addEventListener('click',e=>{if(e.target===bd)closeModal();});
  bd.querySelector('#cb').onclick=closeModal;
  bd.querySelectorAll('.type-btn').forEach(btn=>{
    btn.onclick=()=>{
      pendingType=pendingType===btn.dataset.type?null:btn.dataset.type;
      bd.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===pendingType));
    };
  });
  bd.querySelector('#sb').onclick=async()=>{
    try{
      if(pendingType){
        const res=await fetch(`/api/days/${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:pendingType,source:'manual'})});
        if(!res.ok)throw new Error();
        const data=await res.json();
        custodyMap.set(key,{source:data.source,type:data.type});
      }else if(entry){
        const res=await fetch(`/api/days/${key}`,{method:'DELETE'});
        if(!res.ok)throw new Error();
        custodyMap.delete(key);
      }
    }catch(e){alert('Erreur lors de la mise à jour du jour de garde.');}
    closeModal();render();
  };
  document.body.appendChild(bd);
  modal=bd;
}

function openNoteModal(key,label){
  const ex=notes[key]||'';
  const bd=document.createElement('div');
  bd.className='modal-backdrop';
  bd.innerHTML=`<div class="modal">
    <h3>${label}</h3>
    <textarea id="nt" placeholder="Ajouter une note...">${ex}</textarea>
    <div class="modal-actions">
      ${ex?'<button class="del-btn" id="db">Supprimer note</button>':''}
      <button id="cb">Annuler</button>
      <button class="save-btn" id="sb">Enregistrer</button>
    </div>
  </div>`;
  bd.addEventListener('click',e=>{if(e.target===bd)closeModal();});
  bd.querySelector('#cb').onclick=closeModal;
  bd.querySelector('#sb').onclick=()=>{saveNote(key,bd.querySelector('#nt').value);closeModal();};
  const db=bd.querySelector('#db');
  if(db)db.onclick=()=>{saveNote(key,'');closeModal();};
  document.body.appendChild(bd);
  modal=bd;
  setTimeout(()=>bd.querySelector('#nt').focus(),50);
}

async function saveNote(date,text){
  text=text.trim();
  try{
    if(text){
      const res=await fetch(`/api/notes/${date}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
      if(!res.ok)throw new Error();
      notes[date]=text;
    }else{
      const res=await fetch(`/api/notes/${date}`,{method:'DELETE'});
      if(!res.ok)throw new Error();
      delete notes[date];
    }
  }catch(e){
    alert('Erreur lors de la sauvegarde de la note.');
  }
  render();
}

function openLightbox(photos,startIndex){
  let i=startIndex;
  const lb=document.createElement('div');
  lb.className='lightbox-backdrop';
  function paint(){
    lb.innerHTML=`
      <button class="lightbox-close" title="Fermer">✕</button>
      ${photos.length>1?'<button class="lightbox-nav lightbox-prev" title="Précédente">‹</button>':''}
      <img class="lightbox-img" src="${photos[i].url}" alt="${photos[i].originalName||''}">
      ${photos.length>1?'<button class="lightbox-nav lightbox-next" title="Suivante">›</button>':''}
    `;
    lb.querySelector('.lightbox-close').onclick=close;
    const prev=lb.querySelector('.lightbox-prev');
    const next=lb.querySelector('.lightbox-next');
    if(prev)prev.onclick=e=>{e.stopPropagation();i=(i-1+photos.length)%photos.length;paint();};
    if(next)next.onclick=e=>{e.stopPropagation();i=(i+1)%photos.length;paint();};
  }
  function close(){lb.remove();document.removeEventListener('keydown',onKey);}
  function onKey(e){
    if(e.key==='Escape')close();
    else if(e.key==='ArrowLeft'&&photos.length>1){i=(i-1+photos.length)%photos.length;paint();}
    else if(e.key==='ArrowRight'&&photos.length>1){i=(i+1)%photos.length;paint();}
  }
  lb.addEventListener('click',e=>{if(e.target===lb)close();});
  document.addEventListener('keydown',onKey);
  paint();
  document.body.appendChild(lb);
}

function openPhotoModal(key,label){
  const photos=photosMap.get(key)||[];
  const bd=document.createElement('div');
  bd.className='modal-backdrop';
  bd.innerHTML=`<div class="modal" style="width:600px">
    <h3>${label}</h3>
    <div class="photo-grid">
      ${photos.map(p=>`
        <div class="photo-item">
          <img src="${p.url}" alt="${p.originalName||''}">
          <button class="photo-del" data-id="${p._id}" title="Supprimer">🗑</button>
          <span class="photo-date-icon">📅</span>
          <input type="date" class="photo-move" data-id="${p._id}" value="${key}" title="Changer la date">
        </div>
      `).join('')}
    </div>
    <div class="modal-actions"><button id="cb">Fermer</button></div>
  </div>`;
  bd.addEventListener('click',e=>{if(e.target===bd)closeModal();});
  bd.querySelector('#cb').onclick=closeModal;
  bd.querySelectorAll('.photo-item img').forEach((img,idx)=>{
    img.onclick=()=>openLightbox(photos,idx);
  });
  bd.querySelectorAll('.photo-del').forEach(btn=>{
    btn.onclick=async()=>{
      try{
        const res=await fetch(`/api/photos/${btn.dataset.id}`,{method:'DELETE'});
        if(!res.ok)throw new Error();
      }catch(e){alert('Erreur lors de la suppression de la photo.');}
      closeModal();await loadData();
    };
  });
  bd.querySelectorAll('.photo-move').forEach(inp=>{
    inp.onchange=async()=>{
      try{
        const res=await fetch(`/api/photos/${inp.dataset.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:inp.value})});
        if(!res.ok)throw new Error();
      }catch(e){alert('Erreur lors du déplacement de la photo.');}
      closeModal();await loadData();
    };
  });
  document.body.appendChild(bd);
  modal=bd;
}

async function importPhotos(files){
  const MAX_BATCH_BYTES=22*1024*1024;
  const batches=[];
  let current=[],currentSize=0;
  files.forEach(f=>{
    if(current.length&&currentSize+f.size>MAX_BATCH_BYTES){batches.push(current);current=[];currentSize=0;}
    current.push(f);currentSize+=f.size;
  });
  if(current.length)batches.push(current);

  const bd=document.createElement('div');
  bd.className='modal-backdrop';
  bd.innerHTML=`<div class="modal"><h3>Import des photos</h3><p id="import-status" style="margin-top:0.9rem;font-size:13px;color:#555">Préparation…</p></div>`;
  document.body.appendChild(bd);
  modal=bd;

  const errors=[],duplicates=[];
  for(let i=0;i<batches.length;i++){
    bd.querySelector('#import-status').textContent=`Lot ${i+1}/${batches.length} en cours d'envoi (${batches[i].length} photos)…`;
    const fd=new FormData();
    batches[i].forEach(f=>{fd.append('photos',f);fd.append('mtimes',f.lastModified);});
    try{
      const res=await fetch('/api/photos/batch',{method:'POST',body:fd});
      if(!res.ok)throw new Error();
      const data=await res.json();
      data.results.forEach(r=>{
        if(r.error)errors.push(`${r.originalName} : ${r.error}`);
        else if(r.duplicate)duplicates.push(r.originalName);
      });
    }catch(e){
      errors.push(`Lot ${i+1}/${batches.length} : échec de l'envoi`);
    }
  }
  closeModal();
  await loadData();
  const messages=[];
  if(duplicates.length)messages.push(`${duplicates.length} photo(s) déjà importée(s), ignorée(s).`);
  if(errors.length)messages.push(`${errors.length} erreur(s) :\n${errors.join('\n')}`);
  if(messages.length)alert(messages.join('\n\n'));
}

function closeModal(){if(modal){modal.remove();modal=null;}}

function render(){
  if(!ready)return;
  const today=new Date();
  const todayKey=dk(today.getFullYear(),today.getMonth(),today.getDate());
  const first=new Date(cy,cm,1);
  const last=new Date(cy,cm+1,0);
  let sd=first.getDay();sd=sd===0?6:sd-1;
  const total=Math.ceil((sd+last.getDate())/7)*7;
  const prefix=`${cy}-${String(cm+1).padStart(2,'0')}`;
  const count=[...custodyMap.keys()].filter(d=>d.startsWith(prefix)).length;
  const canPrev=!(cy===2024&&cm===10);
  const _limit=new Date();_limit.setFullYear(_limit.getFullYear()+2);
  const canNext=!(cy>_limit.getFullYear()||(cy===_limit.getFullYear()&&cm>=_limit.getMonth()));
  const prevMonth=cm===0?11:cm-1;
  const prevYear=cm===0?cy-1:cy;
  const prevLast=new Date(prevYear,prevMonth+1,0).getDate();

  let html=`
  <div class="legend">
    <div class="legend-item"><span class="legend-swatch swatch-evening"></span>Soir</div>
    <div class="legend-item"><span class="legend-swatch swatch-day"></span>Journée</div>
    <div class="legend-item"><span class="legend-swatch swatch-full"></span>Journée + nuit</div>
    <div class="legend-item"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#e24b4a;vertical-align:middle"></span>Note</div>
    <span class="counter">${count} jour${count>1?'s':''} de garde</span>
  </div>
  <div class="cal-nav">
    <button id="prev" ${canPrev?'':'disabled'}>‹ Préc.</button>
    <h2>${MFR[cm]} ${cy}</h2>
    <button id="next" ${canNext?'':'disabled'}>Suiv. ›</button>
  </div>
  <div class="cal-week-headers">`;
  DFR.forEach(d=>{html+=`<div class="day-header">${d}</div>`;});
  html+=`</div><div class="cal-grid">`;
  for(let i=0;i<total;i++){
    const dn=i-sd+1;
    if(dn<1){const prevDay=prevLast+dn;html+=`<div class="day-cell empty other-month"><span class="day-num">${prevDay}</span></div>`;}
    else if(dn>last.getDate()){const nextDay=dn-last.getDate();html+=`<div class="day-cell empty other-month"><span class="day-num">${nextDay}</span></div>`;}
    else{
      const key=dk(cy,cm,dn);
      const entry=custodyMap.get(key);
      const isCust=!!entry;
      const isManual=isCust&&entry.source==='manual';
      const typeClass=isCust?`type-${entry.type}`:'';
      const isToday=key===todayKey;
      const hasNote=!!notes[key];
      const photoCount=photosMap.has(key)?photosMap.get(key).length:0;
      const label=`${dn} ${MFR[cm]} ${cy}`;
      html+=`<div class="day-cell ${typeClass}${isCust?' has-custody':''}${isToday?' today':''}" data-key="${key}" data-label="${label}">
        <span class="edit-btn" data-key="${key}" data-label="${label}" title="Modifier la garde">✏️</span>
        ${photoCount?`<span class="photo-btn" data-key="${key}" data-label="${label}" title="Photos">📷${photoCount}</span>`:''}
        <span class="note-btn${hasNote?' has-note':''}" data-key="${key}" data-label="${label}" title="Note">📝</span>
        <span class="day-num">${dn}</span>
        ${hasNote?`<div class="note-preview">${notes[key]}</div>`:''}
      </div>`;
    }
  }
  html+='</div>';
  document.getElementById('cal').innerHTML=html;
  document.getElementById('prev').onclick=()=>{if(!canPrev)return;cm--;if(cm<0){cm=11;cy--;}render();};
  document.getElementById('next').onclick=()=>{if(!canNext)return;cm++;if(cm>11){cm=0;cy++;}render();};
  document.querySelectorAll('.day-cell:not(.empty)').forEach(el=>{
    el.addEventListener('click',()=>{
      if(!custodyMap.has(el.dataset.key))openCustodyModal(el.dataset.key,el.dataset.label);
    });
  });
  document.querySelectorAll('.edit-btn').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openCustodyModal(el.dataset.key,el.dataset.label);});
  });
  document.querySelectorAll('.note-btn').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openNoteModal(el.dataset.key,el.dataset.label);});
  });
  document.querySelectorAll('.photo-btn').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();openPhotoModal(el.dataset.key,el.dataset.label);});
  });
}

document.getElementById('import-btn').onclick=()=>document.getElementById('photo-input').click();
document.getElementById('photo-input').addEventListener('change',e=>{
  const files=[...e.target.files];
  e.target.value='';
  if(files.length)importPhotos(files);
});

loadData();
</script>
</body>
</html>
